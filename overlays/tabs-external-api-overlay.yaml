    update:
      x-conventions:
        pagination: page/limit with currentPage/limit/totalItems response fields
        filtering: 'property:rule:"value" syntax; see https://docs.tabsplatform.com/docs/filter-rules'
        envelope: '{ success, payload }'
  - target: $.externalDocs
    update:
      description: Tabs Platform API documentation
      url: https://docs.tabsplatform.com/docs/getting-started
