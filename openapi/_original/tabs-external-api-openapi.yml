          - jim.doe@example.com
          type: array
          items:
            type: string
        billingAddress:
          description: Customer's billing address
          allOf:
          - $ref: '#/components/schemas/AddressV3Dto'
        shippingAddress:
          description: Customer's shipping address
          allOf:
          - $ref: '#/components/schemas/AddressV3Dto'
        externalIds:
          description: List of external identifiers
          example:
