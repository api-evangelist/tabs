          - LAST_OF_PERIOD
          - ARREARS
          - ADVANCED_DUE_START
        netPaymentTerms:
          type: number
          description: Days between invoice issue and due date
          example: 30
        quantity:
          type: number
          description: Quantity; set to 0 for UNIT billingType
          example: 1
        billingType:
          type: string
          description: Billing type
          example: FLAT
          enum:
          - UNIT
          - FLAT
        pricingType:
          type: string
          description: Pricing type. For TIERED and VOLUME, supply 2+ pricing entries with `tier` indices that are 0-indexed and contiguous (0, 1, 2, …) and `tierMinimum` values starting at 0 and strictly increasing.
          example: SIMPLE
          enum:
          - SIMPLE
          - TIERED
          - VOLUME
        itemId:
          type: string
          description: ERP item ID for the line item
          example: d4e5f6a7-8901-4abc-8def-555555555555
        productId:
          type: string
          description: Product ID from /v3/products. When set, name/description/itemId/classId are populated from the product for any not provided on the billing term. To ensure revenue reporting accuracy, associate the billing term with a product whenever applicable.
          example: c5f6a7b8-9012-4abc-8def-444444444444
          nullable: true
        classId:
          type: string
          description: ERP class ID
          example: e5f6a7b8-9012-4abc-8def-666666666666
        departmentId:
          type: string
          description: Department ID
          example: e5f6a7b8-9012-4abc-8def-777777777777
        projectId:
          type: string
          description: Project ID
          example: f6a7b8c9-0123-4abc-8def-888888888888
        pricing:
          description: Pricing tiers
          example:
          - tier: 1
            amount: 10000
            amountType: TOTAL_INVOICE
            tierMinimum: 0
          type: array
          items:
            $ref: '#/components/schemas/PricingTierDto'
        discount:
          description: Discount configuration
          example:
            type: PERCENTAGE
            amount: '0.10'
          allOf:
          - $ref: '#/components/schemas/DiscountDto'
    ChangeBillingTermGroupEventTypeResponseDto:
      type: object
      properties:
        message:
          type: string
          description: Human-readable summary of what was updated
          example: Updated event type for 1 billing term(s) and 1 performance obligation(s) in group ...
        updatedBillingTermIds:
          description: IDs of the billing terms whose event type was changed
          example:
          - 123e4567-e89b-12d3-a456-426614174000
          type: array
          items:
            type: string
        updatedPerformanceObligationIds:
          description: IDs of the performance obligations whose event type was changed
          example:
          - 123e4567-e89b-12d3-a456-426614174000
          type: array
          items:
            type: string
      required:
      - message
      - updatedBillingTermIds
      - updatedPerformanceObligationIds
    ChangeBillingTermGroupEventTypeDto:
      type: object
      properties:
        billingTermIds:
          description: IDs of the billing terms (within the group) whose event type should be set to toEventTypeId. Pick exactly the rows to change — in a many-to-many group the others are left untouched. May be empty when only performance obligations are being changed.
          example:
          - 123e4567-e89b-12d3-a456-426614174000
          default: []
          type: array
          items:
            type: string
        performanceObligationIds:
          description: IDs of the performance obligations (within the group) whose event type should be set to toEventTypeId. May be empty when only billing terms are being changed.
          example:
          - 123e4567-e89b-12d3-a456-426614174001
          default: []
          type: array
          items:
            type: string
        toEventTypeId:
          type: string
          description: The event type to assign to the selected billing terms and performance obligations. Must belong to the merchant.
          example: 123e4567-e89b-12d3-a456-426614174002
          format: uuid
      required:
      - billingTermIds
      - performanceObligationIds
      - toEventTypeId
