components:
  schemas:
    CreateEventDto:
      type: object
      properties:
        customerId:
          type: string
          description: The ID of the customer
          example: 123e4567-e89b-12d3-a456-426614174000
        datetime:
          format: date-time
          type: string
          description: The date and time of the event
          example: '2021-01-01T00:00:00.000Z'
        eventTypeId:
          type: string
          description: The type of event
          example: 123e4567-e89b-12d3-a456-426614174000
        value:
          type: string
          description: The value of the event, usually a number
          example: '123'
        differentiator:
          type: string
          description: The differentiator of the event
          example: DIFF
        metadata:
          type: object
          description: event metadata
          example: '{"key":"value"}'
        invoiceGroup:
          type: string
          description: The invoice group for split invoicing
          example: '123'
      required:
      - customerId
      - datetime
      - eventTypeId
      - value
      - metadata
    BulkCreateEventDto:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/CreateEventDto'
      required:
      - events
    CreatedEventsDto:
      type: object
      properties:
        customerId:
          type: string
          description: The ID of the customer
          example: 123e4567-e89b-12d3-a456-426614174000
        datetime:
          format: date-time
          type: string
          description: The date and time of the event
          example: '2021-01-01T00:00:00.000Z'
        eventTypeId:
          type: string
          description: The type of event
          example: 123e4567-e89b-12d3-a456-426614174000
        value:
          type: string
          description: The value of the event, usually a number
          example: '123'
        differentiator:
          type: string
          description: The differentiator of the event
          example: DIFF
        metadata:
          type: object
          description: event metadata
          example: '{"key":"value"}'
        invoiceGroup:
          type: string
          description: The invoice group for split invoicing
          example: '123'
        id:
          type: string
          description: The id of the event
          example: 123e4567-e89b-12d3-a456-426614174000
      required:
      - customerId
      - datetime
      - eventTypeId
      - value
      - metadata
      - id
    PaginatedResponseDTO:
      type: object
      properties: {}
    IntegratorsApiError:
      type: object
      properties:
        code:
          type: number
          description: API response code
        message:
          type: string
          description: API response message
        details:
          type: object
          description: Additional details about the error
      required:
      - code
      - message
    IntegratorsApiResponse:
      type: object
      properties:
        payload:
          type: object
          description: Response payload, will be empty when success is false
        success:
          type: boolean
          description: Boolean with true=success, false=failure
        message:
          type: string
          description: Plain-text description of the result
        error:
          description: json element with any error messages or warnings
          allOf:
          - $ref: '#/components/schemas/IntegratorsApiError'
      required:
      - payload
      - success
      - message
      - error
    EventTypeDto:
      type: object
      properties:
        id:
          type: string
          description: The id of the event type
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          description: The name of the event type
          example: Event Type Name
      required:
      - id
      - name
    CreateEventTypeDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the event type
          example: Event Type Name
      required:
      - name
    ClassModelDto:
      type: object
      properties:
        id:
          type: string
          description: The ID of the class model
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          description: The name of the class model
          example: Class Model 1
        externalId:
          type: string
          description: The external ID of the class model
          example: '123'
      required:
      - id
      - name
      - externalId
    DepartmentModelDto:
