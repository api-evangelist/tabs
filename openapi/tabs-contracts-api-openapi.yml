          description: External ID source type
          example: NETSUITE
    RevenueScheduleDto:
      type: object
      properties:
        categoryId:
          type: string
          description: Category Id
          example: 123e4567-e89b-12d3-a456-426614174000
        recognizedRevenue:
          description: Recognized Revenue in each month
          type: array
          items:
            $ref: '#/components/schemas/RecognizedRevenueDto'
