specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Tabs
providerId: tabs
created: '2026-07-21'
modified: '2026-07-21'
generated: '2026-07-21'
method: searched
tags:
  - Rate Limiting
  - Billing
  - Usage Metering
description: >-
  Published and observed rate limiting on the Tabs Platform APIs. The Usage
  API (Beta) documents a fixed-window limit of 10,000 requests per minute per
  merchant, with 429 responses carrying a retryAfter field (seconds). The
  External API host returns x-ratelimit-limit / x-ratelimit-remaining /
  x-ratelimit-reset headers (observed live on
  integrators.prod.api.tabsplatform.com), though no per-tier numbers are
  published for it.
sources:
  - https://docs.tabsplatform.com/docs/usage-events-beta
headers:
  limit: x-ratelimit-limit
  remaining: x-ratelimit-remaining
  reset: x-ratelimit-reset
responseCodes:
  throttled: 429
limits:
  - name: Usage API event ingestion (per merchant)
    scope: merchant
    metric: requests_per_minute
    limit: 10000
    timeFrame: minute
    strategy: fixed-window (60-second window, resets when the next window begins)
    retry_guidance: On 429 wait the retryAfter seconds; retry only on 429/503/network errors with the same idempotency key
